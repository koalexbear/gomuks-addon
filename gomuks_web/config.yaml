name: gomuks Web (private ingress)
version: "0.4.0"
slug: gomuks_web
description: Separate Matrix chat sessions and encryption keys for each HA user
arch:
  - amd64
  - aarch64
startup: application
boot: manual
stage: experimental
breaking_versions:
  - "0.4.0"
init: true
timeout: 60
ingress: true
ingress_port: 8099
ingress_stream: true
panel_icon: mdi:message-lock
panel_title: Matrix
panel_admin: false
host_network: false
ports: {}
options:
  public_origins: []
  allowed_user_ids: []
  max_instances: 4
  legacy_owner_id: ""
schema:
  public_origins:
    - str
  allowed_user_ids:
    - str
  max_instances: int(1,16)
  legacy_owner_id: str
  public_origin: str?
  allowed_user_id: str?
