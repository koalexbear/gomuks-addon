configuration:
  public_origins:
    name: HTTPS-Adressen von Home Assistant
    description: Erlaubte HTTPS-Adressen, ohne Pfad oder abschließenden Schrägstrich. Keine Matrix-Homeserver-Adresse.
  allowed_user_ids:
    name: Zugelassene HA-Benutzer
    description: Leer bedeutet alle über HA-Ingress authentifizierten Benutzer, jeweils mit eigener Instanz. Optional auf exakte HA-Benutzer-IDs beschränken.
  max_instances:
    name: Maximal gleichzeitig laufende Instanzen
    description: Eine Instanz je Benutzer, startet beim ersten Aufruf. Bei Erreichen der Grenze erhalten weitere Benutzer 503. Neustart beendet alle laufenden Instanzen, ohne ihre Daten zu löschen.
  legacy_owner_id:
    name: Besitzer bisheriger Einzelbenutzerdaten
    description: Nur für Migration. Bisherige Daten gehören ausschließlich dieser HA-Benutzer-ID; niemals automatisch dem ersten Besucher.
  public_origin:
    name: Bisherige HTTPS-Adresse (veraltet)
    description: Kompatibilität mit älteren Installationen. Stattdessen HTTPS-Adressen von Home Assistant verwenden.
  allowed_user_id:
    name: Bisheriger Benutzer (veraltet)
    description: Nur als Eigentümer für bestehende Einzelbenutzerdaten übernommen. Beschränkt nicht mehr den allgemeinen Zugriff; dafür Zugelassene HA-Benutzer verwenden.
